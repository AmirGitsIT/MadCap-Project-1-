<?xml version="1.0" encoding="utf-8"?>
<html xmlns:MadCap="http://www.madcapsoftware.com/Schemas/MadCap.xsd">
    <head>
        <style>
			body {
			background-color: rgb(10, 10, 10);
			height: 100vh;  
			margin: 0px;
			overflow: hidden;
			}

			#gallery {
			height: 140vmax;
			width: 140vmax;  
			position: absolute;
			}

			.tile {
			border-radius: 1vmax;
			position: absolute;
			transition: transform 800ms ease;
			}

			.tile:hover {
			transform: scale(1.1);
			}

			.tile:hover &gt; img {
			opacity: 1;
			transform: scale(1.01);
			}

			.tile &gt; img {
			height: 100%;
			width: 100%;
			object-fit: cover;
			border-radius: inherit;
			opacity: 0;
			transition: opacity 800ms ease, transform 800ms ease;
			}

			/* --- Positioning for your 4 available images --- */
			.tile:nth-child(1) {
			background-color: rgb(255, 238, 88);
			height: 25%;
			width: 30%;
			left: 10%;
			top: 10%;
			}

			.tile:nth-child(2) {
			background-color: rgb(66, 165, 245);
			height: 30%;
			width: 25%;
			left: 45%;
			top: 15%;
			}

			.tile:nth-child(3) {
			background-color: rgb(239, 83, 80);
			height: 25%;
			width: 28%;
			left: 15%;
			top: 45%;
			}

			.tile:nth-child(4) {
			background-color: rgb(102, 187, 106);
			height: 28%;
			width: 25%;
			left: 50%;
			top: 50%;
			}

			/* -- Link Styles -- */
			body.menu-toggled &gt; .meta-link &gt; span {
			color: rgb(30, 30, 30);
			}

			#source-link {
			bottom: 60px;
			}

			#source-link &gt; i {
			color: rgb(94, 106, 210);
			}

			#yt-link &gt; i {
			color: rgb(239, 83, 80);
			}

			.meta-link {
			align-items: center;
			backdrop-filter: blur(3px);
			background-color: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 6px;
			bottom: 10px;
			box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.1);
			cursor: pointer;  
			display: inline-flex;
			gap: 5px;
			left: 10px;
			padding: 10px 20px;
			position: fixed;
			text-decoration: none;
			transition: background-color 400ms, border-color 400ms;
			z-index: 10000;
			}

			.meta-link:hover {
			background-color: rgba(255, 255, 255, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.2);
			}

			.meta-link &gt; i, .meta-link &gt; span {
			height: 20px;
			line-height: 20px;
			}

			.meta-link &gt; span {
			color: white;
			font-family: "Rubik", sans-serif;
			font-weight: 500;
			}
		</style>
    </head>
    <body>
        <!-- ========================================================== -->
        <!-- DUMMY-PROOF INSTRUCTIONS FOR ADDING YOUR 4 IMAGES:          -->
        <!-- 1. Look for lines that say src="Resources/Images/..."      -->
        <!-- 2. Replace the file name inside the quotes with the exact  -->
        <!--    file name of your image stored in your Flare project.   -->
        <!--    (Example: src="Resources/Images/my-pic-1.jpg")          -->
        <!-- ========================================================== -->
        <div id="gallery">
            <!-- Tile 1 -->
            <div class="tile">
                <img src="file:///C:/Flare Projects/AmirTest1/Content/Resources/lvzr6l2t1bwh1.jpg" alt="Gallery Image 1" />
            </div>
            <!-- Tile 2 -->
            <div class="tile">
                <img src="file:///C:/Flare Projects/AmirTest1/Content/Resources/8fmqsk7s60zh1.jpeg" alt="Gallery Image 2" />
            </div>
            <!-- Tile 3 -->
            <div class="tile">
                <img src="file:///C:/Flare Projects/AmirTest1/Content/Resources/7il25m2t1bwh1.jpg" alt="Gallery Image 3" />
            </div>
            <!-- Tile 4 -->
            <div class="tile">
                <img src="file:///C:/Flare Projects/AmirTest1/Content/Resources/1b7dyk7s60zh1.jpeg" alt="Gallery Image 4" />
            </div>
        </div>
        <!-- JavaScript that drives the mouse-move panning animation -->
        <script>
			const gallery = document.getElementById("gallery");

			window.onmousemove = e =&gt; {
			const mouseX = e.clientX,
			mouseY = e.clientY;
              
			const xDecimal = mouseX / window.innerWidth,
			yDecimal = mouseY / window.innerHeight;
              
			const maxX = gallery.offsetWidth - window.innerWidth,
			maxY = gallery.offsetHeight - window.innerHeight;
              
			const panX = maxX * xDecimal * -1,
			panY = maxY * yDecimal * -1;
              
			gallery.animate({
			transform: `translate(${panX}px, ${panY}px)`
			}, {
			duration: 4000,
			fill: "forwards",
			easing: "ease"
			})
			}
		</script>
    </body>
</html>
